[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-pipeline-app"
version = "0.1.0"
description = "Full-stack RAG app — hybrid BM25+vector retrieval, FastAPI, Streamlit UI"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "streamlit>=1.35",
    "requests>=2.32",
    "anthropic>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "evals"]

[tool.uv]
constraint-dependencies = [
    "torch<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<5 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers<4 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime<1.20 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
