version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - CHROMA_PATH=/data/chroma_db
      - OBS_DB_PATH=/data/obs.db
      - COLLECTION_NAME=rag_corpus
    volumes:
      - rag_data:/data
      - ./demo/corpus:/app/demo/corpus:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install streamlit requests --quiet &&
             streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api/v1
    volumes:
      - .:/app:ro
    depends_on:
      api:
        condition: service_healthy

  # Optional: local Ollama (uncomment to use local LLM instead of Anthropic)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  rag_data:
  # ollama_data:
